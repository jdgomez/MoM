[TileEntrada]
xposition=0
yposition=0
side=TileSideEntryHall

; Oeste de EntryHall tiene puerta pintada de entrada (llegada narrativa, no usada como
; conexion aqui); el Este esta abierto en el arte y conecta sin TokenDoorInside con Hall2.
[TilePasillo]
xposition=7
yposition=0
side=TileSideHall2

; Se conecta a TilePasillo por su pared sur. Hall2 SI tiene una puerta real pintada ahi
; (columna 4 de 6, ver references/doors.json), pero Lounge no tiene puerta real en la
; columna correspondiente -- se usa la puerta real de Hall2 (TokenExplore en su posicion
; exacta), sin TokenDoorInside en ningun lado.
[TileSalon]
xposition=7
yposition=-3.5
side=TileSideLounge

; Se conecta a TilePasillo por su pared sur/norte compartida. AMBAS losetas tienen una
; puerta real pintada ahi (Hall2 columna 1 norte, Study columna 4 sur) -- el ancla de
; Study se desplazo a x=3.5 (en vez de 7) precisamente para que las dos puertas reales
; coincidan en la misma x=8.75 absoluta. Sin TokenDoorInside en ningun lado.
[TileEstudio]
xposition=3.5
yposition=3.5
side=TileSideStudy

; Se conecta a TilePasillo por su pared oeste. HallStairs SI tiene puerta real pintada ahi
; (columna 0, fila 1 de 3 -- ver references/doors.json); Hall2 no tiene puerta real en su
; pared este pero tampoco tiene nada que estorbe. Se usa la puerta real de HallStairs.
[TileEscalera]
xposition=14
yposition=0
side=TileSideHallStairs

; Se conecta a TileEscalera por su pared oeste. Ninguna de las dos losetas tiene puerta
; real ahi (comprobado con la rejilla-arte 6x6/6x3) -- hace falta TokenDoorInside. El
; ancla se desplazo a y=3.5 (en vez de 0) para que el punto de conexion (y=-1.75, centro
; de la pared este de HallStairs) caiga en la fila 4 del Atico, que es la unica zona libre
; de muebles en su pared oeste (filas 0-3 tienen comoda/muebles cubiertos).
[TileAtico]
xposition=21
yposition=3.5
side=TileSideAttic
